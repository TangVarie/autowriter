# 「写作台」智能体预设：左侧栏「写作台」页签开的对话用这个。
#
# 为什么是一个预设，而不是把写作台挂在每个对话上：
#   - 写作台那一大段协议、deskcore 的十几个工具、拦发牌/查重/存档的闸，
#     只在写品牌小红书稿的时候才该出现。普通对话里带着它，模型会把每一场
#     对话都当成写作台来办。
#   - 所以工具挂在这个预设的 scope 里（dsh-mcp-client 一行），协议由根上的
#     插件按对话注册。预设外的对话两样都没有。
#
# 工具面照 standard 预设抄一份，写作台写稿要用的都在（读写文件、搜索、shell、
# 子智能体、office、网页、待办、压缩），免得换个页签就少一半能力。
- insert:
    - id: preset-writing-desk
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: writing-desk
        name: 写作台
        description: 给品牌写小红书笔记、标题、评论，接项目规则、查重和存档
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 BYWOOD「写作台」里的写手助手：给品牌写小红书笔记、标题、评论，按项目规则改稿。
                这个对话是从写作台的页签开的，写作台协议在系统提示的「写作台」一节——写、改任何东西之前先照它走。
                用户说到品牌、项目，或者贴来一段 brief，就是写作台的项目：先拿简报再动笔，不要凭空写。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # deskcore：写作台自己的 MCP 服务。地址和钥匙是 /desk-setup 存进桌面端凭据库的那两项
          # （<DSH 主目录>/.credentials.yaml 的 refs 下面），钥匙不进配置、不进会话日志。
          #
          # 0.2.1 的写法和正常版不一样，原因有两条：
          #   1. 0.2.1 的 MCP 客户端不认 ${credential:…} 模板，所以这里用 !!js 自己读凭据文件。
          #   2. 0.2.1 在桌面端启动时就把整个预设装好（不是等开对话），之后每次进对话再按
          #      disabled 复查一遍。disabled 两次算出来不一样（装的时候「没配、跳过」，复查时
          #      「配好了、该在」），就报「desk-mcp … never started」，整个对话起不来。
          # 所以 disabled 这个表达式第一次求值时读一次文件，把结果记在 globalThis 上，这个进程里
          # 之后都用这一份；url 和钥匙也从这一份里取。它不靠宿主插件（宿主插件可能比预设晚加载）。
          # 代价：配完 /desk-setup 要完全退出桌面端再打开（Mac 按 ⌘Q）才连得上。
          # 读不到、认不出就当没配：整行不加载，不报错、也不挂工具，系统提示里会说「还没连上」。
          # 这里的解析和 lib/desk.js 的 normalizeBase 是同一套规则，test/preset-connection.test.js 逐条对过。
          - id: desk-mcp
            name: '@deepseek-ai/dsh-mcp-client'
            disabled: !!js |-
              !(globalThis.__bywoodWritingDeskConnection ??= (() => {
                const none = Object.freeze({ configured: false, url: '', key: '' })
                try {
                  const { readFileSync } = process.getBuiltinModule('node:fs')
                  const { join, resolve } = process.getBuiltinModule('node:path')
                  const { homedir } = process.getBuiltinModule('node:os')
                  let file
                  try { file = ctx.get('dshHomePath')?.('.credentials.yaml') } catch {}
                  if (typeof file !== 'string' || !file) {
                    file = resolve(String(process.env.DSH_HOME ?? '').trim() || join(homedir(), '.dsh'), '.credentials.yaml')
                  }
                  const scalar = raw => {
                    const text = raw.trim()
                    if (text.startsWith('"')) {
                      const end = text.lastIndexOf('"')
                      if (end <= 0) return ''
                      try { return JSON.parse(text.slice(0, end + 1)) } catch { return text.slice(1, end) }
                    }
                    if (text.startsWith("'")) {
                      const end = text.lastIndexOf("'")
                      return end <= 0 ? '' : text.slice(1, end).replaceAll("''", "'")
                    }
                    const comment = text.search(/\s#/)
                    return (comment === -1 ? text : text.slice(0, comment)).trim()
                  }
                  const refs = new Map()
                  let inRefs = false
                  let indent
                  for (const line of readFileSync(file, 'utf8').split(/\r?\n/)) {
                    if (!line.trim() || line.trimStart().startsWith('#')) continue
                    if (!/^\s/.test(line)) {
                      inRefs = /^refs\s*:\s*(#.*)?$/.test(line)
                      indent = undefined
                      continue
                    }
                    const match = inRefs ? /^(\s+)([A-Za-z_][A-Za-z0-9_]*)\s*:(?:\s+(.*))?$/.exec(line) : null
                    if (!match) continue
                    indent ??= match[1]
                    if (match[1] === indent) refs.set(match[2], scalar(match[3] ?? ''))
                  }
                  const key = String(refs.get('BYWOOD_DESK_KEY') ?? '').trim()
                  const url = new URL(String(refs.get('BYWOOD_DESK_URL') ?? '').trim())
                  const local = url.hostname === 'localhost' || url.hostname === '127.0.0.1'
                  if (url.protocol !== 'https:' && !(local && url.protocol === 'http:')) return none
                  if (url.username || url.password || url.search || url.hash || !key) return none
                  const path = url.pathname.replace(/\/+$/, '').replace(/\/mcp$/, '')
                  return Object.freeze({ configured: true, url: url.origin + path + '/mcp', key })
                } catch {
                  return none
                }
              })()).configured
            config:
              serverName: deskcore
              transport: streamable-http
              url: !!js "globalThis.__bywoodWritingDeskConnection?.url ?? ''"
              headers:
                X-Deskcore-Key: !!js "globalThis.__bywoodWritingDeskConnection?.key ?? ''"
              startupTimeoutMs: 20000
              # 桌面端一开就是一天：写作台重启、网络抖一段，都别让它「试满 10 次
              # 就放弃、直到重启宿主」。连着 30 秒就重置计数，所以正常使用时它一直在。
              reconnect:
                enabled: true
                initialDelayMs: 500
                maxDelayMs: 30000
                maxAttempts: 1000
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          # 没有 customSkillDirs：standard 预设里那一行用 !!js + createRequire(baseUrl)
          # 去解析 dsh-agent-preset 包里的 skills，本包是工作区里的链接包，从它解析
          # 不到那个包（会抛错、连累整行）。写作台不需要那份 dsh-doc，用默认技能源。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # 没有 tool-office：0.2.1 里没有这个包（Intel Mac 上的桌面版停在 0.2.1），列上会让整个预设起不来。
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
