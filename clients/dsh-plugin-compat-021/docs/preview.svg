<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="The writing desk entry in the left sidebar and the ordinary conversation it opens: a user message, an assistant reply, and the composer.">
  <!-- Window -->
  <rect x="30" y="28" width="580" height="244" rx="14" fill="#FBF9F6" stroke="#CFC7BC" stroke-width="1.5"/>

  <!-- Left sidebar: three entries, the second one selected -->
  <path d="M44 42h64v216H44a12 12 0 0 1-12-12V54a12 12 0 0 1 12-12Z" fill="#F1EDE7"/>
  <rect x="66" y="62" width="20" height="20" rx="6" fill="none" stroke="#8C857B" stroke-width="2"/>
  <rect x="60" y="94" width="32" height="26" rx="8" fill="#D97706" fill-opacity="0.16" stroke="#D97706" stroke-width="2"/>
  <path d="M64 103h18M64 109h11" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
  <rect x="66" y="132" width="20" height="20" rx="6" fill="none" stroke="#8C857B" stroke-width="2"/>

  <!-- Conversation header: title + preset chip -->
  <rect x="126" y="52" width="118" height="11" rx="5.5" fill="#4A443C"/>
  <rect x="500" y="48" width="82" height="19" rx="9.5" fill="#FFFFFF" stroke="#CFC7BC" stroke-width="1.2"/>
  <rect x="512" y="54" width="58" height="7" rx="3.5" fill="#B7AFA4"/>

  <!-- Assistant turn -->
  <circle cx="142" cy="96" r="9" fill="#D97706" fill-opacity="0.18" stroke="#D97706" stroke-width="1.6"/>
  <rect x="160" y="88" width="238" height="8" rx="4" fill="#C9C1B6"/>
  <rect x="160" y="102" width="196" height="8" rx="4" fill="#C9C1B6"/>
  <rect x="160" y="116" width="150" height="8" rx="4" fill="#DCD5CA"/>

  <!-- User turn, right aligned -->
  <rect x="332" y="140" width="250" height="42" rx="12" fill="#1E5754" fill-opacity="0.10" stroke="#1E5754" stroke-opacity="0.20" stroke-width="1.2"/>
  <rect x="346" y="152" width="186" height="8" rx="4" fill="#1E5754" fill-opacity="0.55"/>
  <rect x="346" y="166" width="132" height="8" rx="4" fill="#1E5754" fill-opacity="0.35"/>

  <!-- Composer -->
  <rect x="126" y="204" width="456" height="44" rx="12" fill="#FFFFFF" stroke="#DCD5CA" stroke-width="1.2"/>
  <rect x="142" y="221" width="196" height="9" rx="4.5" fill="#DCD5CA"/>
  <circle cx="552" cy="226" r="14" fill="#D97706"/>
  <path d="M547 226h10M552 221v10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
