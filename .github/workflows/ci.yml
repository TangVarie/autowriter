              """RPC 没部署时退回 Python 路径, 且两条路径对同一份数据结论一致。"""
              body = "第一支是豆沙色。" * 12
              fp_row = {"id": "f1", "project_id": "p1", "title": "去年那篇口红合集", "opening": "",
