          class _PQ:
              def __init__(s, store, log, cap):
                  s.s, s.log, s.cap, s.orders = store, log, cap, []
              def select(s,*a,**k): return s
              def eq(s,*a,**k): return s
              def neq(s,*a,**k): return s
              def is_(s,*a,**k): return s
              @property
              def not_(s): return s
              def order(s,c,**k): s.orders.append(c); return s
              def range(s,lo,hi): s.lo, s.hi = lo, hi; return s
              def execute(s):
                  page = s.s[s.lo:s.hi+1]
                  if s.cap is not None: page = page[:s.cap]
                  s.log.append({"order": list(s.orders), "range": (s.lo, s.hi)})
                  return _R(page)
