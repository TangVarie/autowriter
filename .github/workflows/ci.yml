                                  "version_num": 1, "embedding": None}]}
                   for n in range(2500)]
          sb4 = _PSB(items, cap=137)
          assert len(S.legacy_versions(sb4, "p")) == 2500, "backfill 源数据漏行"
          assert sb4.log[0]["order"] == ["created_at", "id"], sb4.log[0]

          assert S.existing_fingerprint_version_ids(_PSB([]), "p") == set()
          assert S.legacy_versions(_PSB([]), "p") == []
          assert S.fingerprints_needing_vectors(_PSB([]), "p", "m") == []
          sb5 = _PSB([{"id": f"f{i}", "title": "t"} for i in range(5000)])
          S.fingerprints_needing_vectors(sb5, "p", "m", limit=2000)
          # 它现在分三次查询(三种"不可用"各一次, 见函数里为什么不写成 .or_())。
          # 第一次就凑满 hard_cap 时**必须当场收工**, 不许把另外两次也打出去 ——
          # 否则一个大项目每跑一次 reembed 就多两轮翻页的空转。
          assert len(sb5.log) == 2, f"hard_cap 到顶还在多打请求: {len(sb5.log)}"
          # 别再退回裸 .limit()。
          #
          # ⚠️ 这条原来写的是 `"_paged(" in body` —— 文本匹配。第三批把
          # legacy_versions 改成委托给 legacy_version_pages(逐页 yield, 审计
          # ROB-011)之后它当场误报"没走翻页", 而翻页明明还在, 只是深了一层。
          # 这正是第二批记过的教训: 钉死写法的断言要走 AST 且钉【被禁的形态】,
          # 不是钉【当前的写法】—— 后者每次合理重构都会假报警。
          # 真正要禁的是"用一个常数 .limit(N) 冒充取全量"。翻页本身由上面
          # 那些行为断言(钳到 137/页仍取全 2500)保证。
          for fn in (S.legacy_versions, S.existing_fingerprint_version_ids,
                     S.fingerprints_needing_vectors, S.list_all_projects):
              tree = ast.parse(textwrap.dedent(inspect.getsource(fn)))
