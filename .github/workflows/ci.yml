          def t_codex_p1_rpc_search_path():
              """基线里每个固定了 search_path 的函数, 都要够得着它引用的表。

              codex review 2026-08-24: 新加的两个 RPC(以及旁边两个老的)写着
              `SET search_path = pg_catalog, extensions`, 函数体里却裸用 draft_fingerprints
              —— 运行时报 relation ... does not exist。而那句话里带 "does not exist",
              正好被 store.rpc_missing 认成"迁移没跑", 于是静默退回 Python 慢路径。
              坏得毫无声响, 这条断言就是为了让它不能再回来。
              """
              import re
              # 审计 SUP-010: 基线从 db.CREATE_TABLES_SQL 搬成了 .sql 文件。
              sql = open("migrations/000_baseline.sql", encoding="utf-8").read()
              fns = list(re.finditer(r"CREATE OR REPLACE FUNCTION (\w+)\(", sql))
              assert len(fns) >= 6, f"只找到 {len(fns)} 个函数, 正则可能失配了"
              checked = 0
              for i, m in enumerate(fns):
                  end = fns[i + 1].start() if i + 1 < len(fns) else len(sql)
                  body = sql[m.start():end]
                  sp = re.search(r"SET search_path = ([^\n]*)", body)
                  if not sp:
                      continue           # 没固定 search_path = 跟随调用方, 不在本条管辖
                  path = sp.group(1).split("--")[0]
                  # 函数体里引用的表。只看 DML 关键字后面的裸标识符, 并排掉:
                  #   · 后面跟 "(" 的     → 是函数调用(jsonb_array_elements 之类), 不是表
                  #     ⚠️ 这里的量词必须是**占有型** `*+`(py3.11+): 贪婪的 `*` 会为了
                  #     满足 (?!\s*\() 而回溯, 把 jsonb_array_elements( 匹配成
                  #     "jsonb_array_element" 混进表名里。
                  #   · REVOKE/GRANT 行的 → "FROM anon" 那种, 是角色不是表
                  #   · INTO 后面的       → plpgsql 变量名, 不是表
                  stmt = "\n".join(l for l in body.splitlines()
                                   if not l.lstrip().upper().startswith(("REVOKE", "GRANT")))
                  refs = {t for t in re.findall(
                      r"(?:FROM|UPDATE|JOIN)\s+([a-z_][a-z0-9_]*+)(?!\s*\()", stmt)}
                  qualified = set(re.findall(r"autowriter\.([a-z_][a-z0-9_]*)", body))
                  bare = refs - qualified
                  if not bare:
                      continue
                  checked += 1
                  assert "autowriter" in path, (
                      f"{m.group(1)} 固定了 search_path={path.strip()!r}, 却裸用表 "
                      f"{sorted(bare)} —— 运行时找不到表, 而报错会被 rpc_missing 当成"
                      f"'迁移没跑'静默降级")
              assert checked >= 4, f"只校到 {checked} 个函数, 断言可能没在真的守东西"


          def t_sup002_no_fail_open():
              """查重是硬闸: 除了"RPC 不存在", 任何错误都必须上抛, 不能静默放行。"""
              class _Boom(_SB):
                  def rpc(self, name, args):
                      raise RuntimeError("permission denied for function deskcore_check_drafts")

              try:
                  C.check_drafts(_Boom(), "p1", _DRAFTS, user_id=OWNER)
              except RuntimeError as exc:
                  assert "permission denied" in str(exc)
              else:
                  raise AssertionError("权限错被当成'迁移没跑'静默降级了 —— 查重不能 fail-open")

              assert S.rpc_missing(RuntimeError("PGRST202 Could not find the function")) is True
              assert S.rpc_missing(RuntimeError("permission denied")) is False


          def t_rob004_health_pool():
              """/health 不能和工具抢同一个线程池。

              ⚠️ 这条**只读源码不 import**。deskcore/app.py 需要 fastapi + mcp, 它们在
              `deskcore/requirements.txt` 而不是主 lockfile 里 —— 本步骤刻意只装
              lockfile(与前两批的回归步一致), import 会直接 ModuleNotFoundError。
              真正起服务打 /health 的是下面那一步 app 冒烟。
              """
              tree = ast.parse(open("deskcore/app.py", encoding="utf-8").read())

              fns = {n.name: n for n in ast.walk(tree)
                     if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
              assert isinstance(fns.get("health"), ast.AsyncFunctionDef), \
                  "/health 若是同步路由(def)就仍然占用 starlette 的默认线程池 —— ROB-004 没修掉"

              # 私有额度: anyio.CapacityLimiter(N), N >= 2
              lim = [n for n in ast.walk(tree)
                     if isinstance(n, ast.Assign)
                     and any(isinstance(t, ast.Name) and t.id == "_HEALTH_LIMITER"
                             for t in n.targets)]
              assert len(lim) == 1, "拿不到 _HEALTH_LIMITER 的定义"
              call = lim[0].value
              assert isinstance(call, ast.Call) and getattr(call.func, "attr", "") == "CapacityLimiter", \
                  ast.dump(call)[:120]
              assert isinstance(call.args[0], ast.Constant) and call.args[0].value >= 2, \
                  "额度 1 会让平台健康检查和人工 curl 互相排队"

              probe = fns.get("_probe")
              assert isinstance(probe, ast.AsyncFunctionDef), "_probe 不见了"
              kw = [k for n in ast.walk(probe) if isinstance(n, ast.Call) for k in n.keywords]
              assert any(k.arg == "limiter" and isinstance(k.value, ast.Name)
                         and k.value.id == "_HEALTH_LIMITER" for k in kw), \
                  "探测没用私有 limiter —— 还是会排在工具后面"
              assert any(getattr(n.func, "attr", "") == "fail_after"
                         for n in ast.walk(probe) if isinstance(n, ast.Call)), \
                  "探测没有墙钟上限, 库卡死(TCP 黑洞)时 /health 会一直挂着不返回"

              # 工具那条路仍然走默认线程池 —— 两者必须是【不同】的池子, 否则等于没分
              tool = fns.get("rest_tool")
              assert any(getattr(n.func, "id", "") == "run_in_threadpool"
                         for n in ast.walk(tool) if isinstance(n, ast.Call)), \
                  "工具路由不再走 run_in_threadpool? 那这条断言的前提变了, 要重新想"


