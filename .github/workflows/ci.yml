          assert "history_truncated" in inspect.getsource(C.check_drafts)
          print("  ✓ 翻页带确定性次级键; check_drafts 会把截断报给调用方")

          # ── 4. 角度池必须洗牌, 否则后面的角度永远轮不到 ──────────────────
          dsrc = inspect.getsource(C.draw_angles)
          assert "rng.shuffle(angle_order)" in dsrc, "角度池没洗牌"
          # 只看【赋值那一行】—— 上面的说明注释里引用了旧写法, 拿整段源码做
          # "not in" 会误伤自己的注释。
          assert "angle = angle_order[len(picked) % len(angle_order)]" in dsrc, \
              "取角度没走洗过牌的 angle_order"
          assert "angle = angles_pool[" not in dsrc, "还在直接按 angles_pool 顺序取"
          import random
          pool = [f"a{i}" for i in range(6)]
          seen = set()
          for s in range(12):                      # 模拟 12 次"每批 3 篇"
              r = random.Random(s); order = list(pool); r.shuffle(order)
              seen.update(order[:3])
              assert list(random.Random(s).sample(pool, len(pool))) or True
          assert seen == set(pool), f"6 个角度里只用到了 {sorted(seen)}"
          print("  ✓ 每批 3 篇 × 多批后, 6 个角度全部被用到(旧写法只会用前 3 个)")
          r1 = [x for x in pool]; random.Random(7).shuffle(r1)
          r2 = [x for x in pool]; random.Random(7).shuffle(r2)
          assert r1 == r2, "同 seed 必须可复现(draw 支持 --seed)"
          print("  ✓ 同 seed 洗牌结果可复现")

          # ── 5. embedding_model 必须跟着向量一起写 ────────────────────────
          # 换 embedding 供应商时唯一的救命稻草: 跨模型算余弦是垃圾且不报错。
          # 没有这一列, 迁移期新旧向量混在一张表里, 查重安静失灵。
          csrc = inspect.getsource(C.commit_drafts)
          assert '"embedding_model": dedup.EMBEDDING_MODEL if emb else None' in csrc, \
              "commit 路径没记 embedding_model"
          assert '"embedding_model": r["embedding_model"]' in csrc, \
              "降级直插路径没记 embedding_model"
          bsrc = inspect.getsource(C.backfill_fingerprints)
          assert "embedding_model" in bsrc, "backfill 没记 embedding_model"
          # ⚠️ 光"记了"不够 —— 记**错**比不记更坏(codex aw#65 P1)。backfill 会复用
          # versions.embedding 里的历史向量, 而那张表【没有模型标记】, 来路无法
          # 证明。贴上当前模型的标签之后, 那些行会被当成"本模型产的"参与比对,
          # 而且再也不会被 reembed 挑出来重算 —— 库里从此混着两套向量空间,
          # 没有任何东西能分辨。所以只有【现算】的才敢写模型名。
          assert "if attested else None" in bsrc, \
              "backfill 给来路不明的历史向量也贴了当前模型的标签"
          for f in ("migrations/001_deskcore.sql", "migrations/000_baseline.sql"):
              t = open(f, encoding="utf-8").read()
              assert "embedding_model" in t, f"{f} 缺 embedding_model 列"
          sql = open("migrations/001_deskcore.sql", encoding="utf-8").read()
          assert "title_embedding, embedding_model, opening_hash" in sql, \
              "RPC 的 INSERT 没带上 embedding_model"
          print("  ✓ commit/降级/backfill 三条写入路径都记 embedding_model, 两份 SQL 都有这一列")

          # ── 6. 欠费的静默洞: 配了 embedding 却取不到向量要报警 ───────────
          # embeddings_available() 判的是客户端能否构建(进程级单例, 启动即缓存),
          # 不是调用能否成功。欠费后它仍为 True, embed_texts 返回 None,
          # 稿子照常入库但没有向量 —— 而 backfill 补不了这些行(它扫
          # items×versions, WorkBuddy 的稿子 version_id 为空不在那里)。
          assert "embed_failed" in csrc and "embedding_warning" in csrc, \
              "commit 没区分'没配 embedding'和'配了但调用失败'"
          assert callable(C.reembed_fingerprints), "缺 reembed 修复路径"
          assert "reembed" in open("deskcore/cli.py", encoding="utf-8").read()
          rsrc = inspect.getsource(C.reembed_fingerprints)
          assert "fingerprints_needing_vectors" in rsrc and "set_fingerprint_vector" in rsrc
          # ⚠️ 2026-08-26 换模型之后又加了一层(codex aw#65 P1): reembed 要修的
          # 不只是"没算过"的行, 还有"换了模型作废"和"来路不明"的行 —— 所以它
          # 必须把**当前模型**传下去。原来这个函数叫 fingerprints_missing_vectors
          # 且只扫 NULL 向量, 那时换一次模型就会让老行既进不了比对、又永远不会
          # 被重算, 卡在一个没有出口的状态里。
          assert "dedup.EMBEDDING_MODEL" in rsrc, \
              "reembed 没把当前模型传下去 —— 那它挑不出换模型作废的那些行"
          print("  ✓ 取向量失败会显式报警, 且有 reembed 能补(backfill 够不着的那些行)")

          print("\ndeskcore round-7 回归: 6/6 通过")
          PY

      - name: deskcore round-8 回归 (蒸馏搬给调用方模型的两步闭环)
        run: |
          python - <<'PY'
          import inspect
          import deskcore.core as C
          import deskcore.tools as T
          import deskcore.store as S

          class _Resp:
              def __init__(self, d, c=None): self.data = d; self.count = c
          class _Q:
              def __init__(self, tbl, st): self.t = tbl; self.st = st; self.filters = {}
              def select(self, *a, **k): self.cnt = k.get("count"); return self
              def eq(self, k, v): self.filters[k] = v; return self
              def in_(self, k, v): self.ids = list(v); return self
              def order(self, *a, **k): return self
              def limit(self, n=None, *a, **k): self.n = n; return self
              def upsert(self, row, *a, **k): self.st.setdefault("saved", []).append(row); return self
              def update(self, row, *a, **k): self.upd = row; return self
              def insert(self, row, *a, **k): self.st.setdefault("edits", []).append(row); return self
              def execute(self):
                  if self.t == "projects":
                      # 审计 COR-015: record_edit / save_my_style / my_style 先过
                      # 归属校验。本块验的是两步闭环, 不是归属 —— 兜一行 owner=u1。
                      return _Resp([{"id": "p1", "owner_id": "u1",
                                     "calibration_notes": ""}])
                  if self.t == "style_edits":
                      if getattr(self, "upd", None):          # 销账
                          ids = getattr(self, "ids", [])
                          hit = [r for r in self.st.get("rows", []) if r["id"] in ids]
                          self.st["marked_ids"] = self.st.get("marked_ids", []) + [r["id"] for r in hit]
                          self.st["pending"] = max(0, self.st.get("pending", 0) - len(hit))
                          return _Resp(hit)
                      if getattr(self, "cnt", None) == "exact":
                          return _Resp([], self.st.get("pending", 0))
                      rows = self.st.get("rows", [])
                      n = getattr(self, "n", None)      # insert 路径不调 limit()
                      return _Resp(rows[:n] if n else rows, len(rows))
                  if self.t == "user_calibration_notes":
                      return _Resp([{"notes": self.st.get("notes", ""),
                                     "updated_at": "2026-01-01"}])
                  return _Resp([])
          class _SB:
              def __init__(self, st): self.st = st
              def table(self, t): return _Q(t, self.st)

          EDIT = {"id": "e1", "ai_title": "AI标题", "ai_body": "AI正文",
                  "my_title": "我改的标题", "my_body": "我改的正文", "note": "太夸张"}

          # ── 1. build_distillation_task 出材料, 【不调 LLM】 ───────────────────
          st = {"rows": [EDIT], "notes": "已有笔记第一条", "pending": 1}
          task = C.build_distillation_task(_SB(st), "p1", user_id="u1")
          for k in ("instruction", "existing_notes", "edits", "edit_count"):
              assert k in task, f"蒸馏任务少了 {k}: {task}"
          assert task["existing_notes"] == "已有笔记第一条"
          assert "我改的标题" in task["edits"] and "太夸张" in task["edits"]
          assert task["edit_count"] == 1
          assert task["edit_ids"] == ["e1"], task.get("edit_ids")
          # 口径必须由服务端给, 不能让每个平台自己发挥
          assert "铁律" in task["instruction"] and len(task["instruction"]) > 100
          print(f"  ✓ 蒸馏任务含 instruction/existing_notes/edits/edit_ids({task['edit_count']} 条)")
          assert C.build_distillation_task(_SB({"rows": []}), "p1", user_id="u1") is None
          print("  ✓ 没有精修时返回 None(不硬造任务)")

          # 待吸收多于一次快照时要明说, 别让人以为一次吸收完了
          many = [dict(EDIT, id=f"e{i}") for i in range(12)]
          t2 = C.build_distillation_task(_SB({"rows": many, "pending": 12, "notes": ""}),
                                         "p1", user_id="u1", max_edits=8)
          assert t2["edit_count"] == 8 and len(t2["edit_ids"]) == 8, t2["edit_count"]
          assert t2.get("more_pending") == 4, t2.get("more_pending")
          print("  ✓ 12 条待吸收 → 本批 8 条 + 明说还剩 4 条(more_pending)")

          # ── 2. record_edit 把任务交出去, 并【明说没做完】 ────────────────────
          st = {"rows": [EDIT], "notes": "", "pending": 1}
          # EDIT 带 id(那是库里的行), record_edit 的入参没有 id, splat 前摘掉
          EDIT_IN = {k: v for k, v in EDIT.items() if k != "id"}
          out = C.record_edit(_SB(st), "p1", user_id="u1", **EDIT_IN)
          assert out["stored"] is True
          assert "distillation_task" in out, out
          assert "save_my_style" in out["next_step"], out["next_step"]
          assert "edit_ids" in out["next_step"], "next_step 要教把 edit_ids 传回来"
          assert "白喂" in out["next_step"] or "没做完" in out["next_step"], out["next_step"]
          print("  ✓ record_edit 返回任务 + 明确的 next_step(指名 save_my_style)")
          # AI 版与手改版一样 = 不是有效信号, 不该入库也不该发任务
          same = {"ai_title": "同", "ai_body": "同", "my_title": "同", "my_body": "同"}
          out2 = C.record_edit(_SB({"rows": []}), "p1", user_id="u1", **same)
          assert out2["stored"] is False and "distillation_task" not in out2
          print("  ✓ 没真改的对子不入库、不发蒸馏任务")

          # ── 3. save_my_style 只销【传进来的那几条】的账 ──────────────────────
          # ⚠️ 这是本 PR 第一版的 P1: 原来按 user+project 把所有未吸收的都标掉,
          # 而笔记只覆盖了快照里那 8 条。快照外的行(第 9 条往后、以及拿到任务
          # 之后新 record_edit 进来的)会从 pending 里消失却从没影响过笔记 ——
          # 用户喂了稿子, 计数归零看着正常, 那几条等于白喂。
          rows = [dict(EDIT, id=f"e{i}") for i in range(3)]
          st = {"rows": rows, "notes": "旧", "pending": 3}
          sb = _SB(st)
          r = C.save_my_style(sb, "p1", "新的完整笔记\n第二行",
                              user_id="u1", edit_ids=["e0", "e1"])
          assert r["saved"] is True and r["lines"] == 2, r
          assert st["saved"][0]["notes"] == "新的完整笔记\n第二行"
          assert sorted(st.get("marked_ids", [])) == ["e0", "e1"], st.get("marked_ids")
          assert r["edits_absorbed"] == 2, r
          assert r["pending_distillation"] == 1, r
          assert "still_pending" in r, "还有没吸收的必须说出来"
          print("  ✓ 只销掉传进来的 e0/e1; 第三条仍留在 pending 并被明确报出")

          # 不传 edit_ids = 手动改笔记, 【不能】顺手把待处理的精修标掉
          st2 = {"rows": rows, "notes": "旧", "pending": 3}
          r2 = C.save_my_style(_SB(st2), "p1", "手动改的笔记", user_id="u1")
          assert st2.get("marked_ids", []) == [], "手动改笔记不该销账"
          assert r2["edits_absorbed"] == 0 and r2["pending_distillation"] == 3, r2
          assert "note" in r2, "要提示这次没销账"
          print("  ✓ 不传 edit_ids(手动改笔记) → 一条都不销, 待吸收原样保留")
          # 空笔记必须拒绝 —— 否则一次失手会把积累的个人风格清空
          for empty in ("", "   ", "\n\n"):
              try:
                  C.save_my_style(_SB({}), "p1", empty, user_id="u1")
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"空笔记被接受了: {empty!r}")
          print("  ✓ 空笔记被拒(不会把已有个人风格清掉)")

          # ── 4. 两步之间断掉必须【看得见】 ────────────────────────────────────
          # 这是本次改动引入的新失败模式: record_edit 调了、save_my_style 没调,
          # diff 存着但笔记没变 —— "喂了稿子却没变得像我", 且完全无声。
          # my_style 的 pending_distillation 就是那个断点的可见性。
          assert "pending_distillation" in inspect.getsource(C.my_style)
          st = {"pending": 3, "rows": [], "notes": "n"}
          assert S.count_pending_distillation(_SB(st), "p1", "u1") == 3
          assert S.count_pending_distillation(_SB({"pending": 0}), "p1", "u1") == 0
          print("  ✓ 断点计数正确")
          assert "pending_distillation" in (T.my_style.__doc__ or ""), \
              "my_style 的说明里要教模型看这个数, 否则报了也没人看"

          # ⚠️ 光报个数字不够(本 PR 第一版的 P2): 断点最典型的形态就是【会话没了】,
          # 那时 record_edit 那次的返回值也一起丢了。只给数字的话调用方拿不回
          # 材料和口径, 文档里写的"重新提炼一次写回"根本做不到, 除非让用户把
          # 同一条精修再喂一遍(会造重复行)。所以 pending>0 时要把任务带上。
          import db as _db2
          _origp = _db2.get_project
          _db2.get_project = lambda *a, **k: {"calibration_notes": "共享基线"}
          try:
              ms = C.my_style(_SB({"pending": 2, "rows": [EDIT], "notes": "我的笔记"}),
                              "p1", user_id="u1")
