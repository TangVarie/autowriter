          print(f"  ✓ COR-003 {len(LONG)} 字笔记的 witness 压成 32 字节 md5; 冲突/未部署/权限错三态分清; 两份 SQL 判据一致")

          # ══ COR-007: 静音判定必须复用 db.is_memory_muted_now ═══════════════
          # 本地那版对 naive ISO 和 7 位微秒会抛异常 → except 返 True →
          # 【被静音的规则照常注入 P0/P1】。
          class _MQ:
              def __init__(s, rows): s.r = rows
              def select(s,*a,**k): return s
