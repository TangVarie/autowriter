          def t_sup001_fallback():
              """中转站拒绝 ttl → 当场降级重试, 不能让整批生成挂掉。"""
              import anthropic

              def _bad_request(msg):
                  # 不走 __init__: 它要一个真实的 httpx Response, 而底层 http 库在不同
                  # SDK 版本里叫 httpx / httpx2。这里只需要类型 + str() + status_code。
                  exc = anthropic.BadRequestError.__new__(anthropic.BadRequestError)
                  Exception.__init__(exc, msg)
                  exc.message = msg
                  exc.status_code = 400
                  return exc

              G._cache_ttl_disabled = False
              seen = []

              def _rebuild():
                  seen.append(G._cache_control())

              n = {"i": 0}

              def _call():
                  n["i"] += 1
                  if n["i"] == 1:
                      raise _bad_request("cache_control.ttl is not supported by this endpoint")
                  return "ok"

              assert G._call_with_retry(_call, rebuild=_rebuild) == "ok", "没有降级重试"
              assert G._cache_ttl_disabled is True, "被拒之后没关掉 ttl, 每一次请求都会再撞一遍"
              assert seen == [{"type": "ephemeral"}], seen
              assert n["i"] == 2, n

              # 关掉之后所有构造点都不带 ttl 了
              blocks = G._system_to_claude_param({"stable": "S", "p1": "P"})
              assert all(b.get("cache_control") == {"type": "ephemeral"}
                         for b in blocks if "cache_control" in b), blocks

              # 普通 400 照旧上抛, 不能被当成 ttl 问题吞掉
              G._cache_ttl_disabled = False
              try:
                  G._call_with_retry(lambda: (_ for _ in ()).throw(_bad_request("max_tokens invalid")),
                                     rebuild=_rebuild)
              except anthropic.BadRequestError:
                  pass
              else:
                  raise AssertionError("普通 400 被当成 ttl 问题吞掉了")
              assert G._cache_ttl_disabled is False
              G._cache_ttl_disabled = False


