              assert G.generate_batch(system_prompt="s", tactic="t", count=2,
                                      engines=[], metrics=None) == []
          finally:
              G.get_engine = _orig_ge
          print("  ✓ COR-022 engines 去重保序; 单引擎路径不变; 空 engines 不炸")

          # ══ COR-002: slot ↔ item 配对不能靠返回顺序, 缺行不能静默丢 ═════════
          # app.py 是 streamlit 脚本(顶层会跑 UI), 只把这两个纯函数取出来跑。
          _tree = ast.parse(open("app.py", encoding="utf-8").read())
          _mod = types.ModuleType("appfrag")
          _mod.__dict__.update(db=db, validator=validator, telemetry=telemetry, uuid=uuid)
          for _n in _tree.body:
              if isinstance(_n, ast.FunctionDef) and _n.name in ("_save_batch_results",
                                                                 "_run_hard_constraint_check"):
                  exec(compile(ast.Module([_n], []), "app.py", "exec"), _mod.__dict__)
          class GR:
              def __init__(s, t, b):
                  s.title, s.body, s.ai_engine, s.error = t, b, "claude/x", None
                  s.keywords = []; s.token_usage = {}
          class _ISB:
              def __init__(s, mode="ok"): s.mode = mode; s.inserted = []; s.deleted = []
              def table(s, t):
                  outer = s
                  class _Q:
                      def __init__(_): _.t = t; _.op = None
                      def insert(_, rows, *a, **k): _.op = "ins"; _.rows = rows; return _
                      def delete(_, *a, **k): _.op = "del"; return _
                      def in_(_, c, v): _.ids = v; return _
                      def eq(_, *a, **k): return _
                      def execute(_):
                          class R: pass
                          r = R()
                          if _.op == "del":
                              outer.deleted.extend(getattr(_, "ids", [])); r.data = []; return r
                          rows = [dict(x) for x in _.rows]
                          if _.t == "items":
                              outer.inserted.extend(rows)
                              if outer.mode == "reversed": rows = list(reversed(rows))
                              if outer.mode == "short":    rows = rows[:-1]
                          r.data = rows; return r
                  return _Q()
          slots_in = [{"versions": [GR(f"标题{i}", f"正文{i}")], "ai_review_notes": f"note{i}"}
                      for i in range(3)]
          errs = []; sb = _ISB("reversed")
          items, vers, _ = _mod._save_batch_results(sb, "b1", "u1", slots_in, "P：", errs)
          assert not errs and len(items) == 3 and len(vers) == 3, (errs, len(items), len(vers))
          notes = {r["id"]: r.get("ai_review_notes") for r in sb.inserted}
          for i, v in enumerate(vers):
              assert v["title"] == f"标题{i}", (i, v["title"])
              assert notes[v["item_id"]] == f"note{i}", \
                  f"第 {i} 篇挂到了别的 item 上 —— 按位置 zip 的老毛病"
          errs = []; sb = _ISB("short")
          items, vers, titles = _mod._save_batch_results(sb, "b1", "u1", slots_in, "P：", errs)
          assert items == [] and vers == [] and titles == [], "回执缺行却继续往下走"
          assert errs and "只回执 2/3" in errs[0], errs
          assert len(sb.deleted) == 2, f"没回收已插的行: {sb.deleted}"
          errs = []
          items, vers, _ = _mod._save_batch_results(_ISB("ok"), "b1", "u1", slots_in, "P：", errs)
          assert len(items) == 3 and len(vers) == 3 and not errs
          print("  ✓ COR-002 回执逆序仍配对正确; 缺行→整批失败+回收, 不静默丢尾部")

          # ══ COR-011: 同一 item 的多个违规 version 只标记一次 ════════════════
          class _M:
              def __init__(s): s.n = 0
              def incr(s, k, v=1): s.n += v
          calls = []
          _orig_us = db.update_item_status
          db.update_item_status = lambda c, i, st: calls.append(i)
          try:
              ivs = [{"item_id": "A", "title": "全网最低价", "body": "最好", "keywords": []},
                     {"item_id": "A", "title": "最强", "body": "最", "keywords": []},
                     {"item_id": "B", "title": "最快", "body": "", "keywords": []}]
              e = []
              _mod._run_hard_constraint_check(None, ivs, [{"content": "禁止出现'最'字"}], "P：", e, _M())
              assert calls == ["A", "B"], f"重复标记了: {calls}"
              assert len(e) == 3, f"警告应逐条给出, 实际 {len(e)}"
          finally:
              db.update_item_status = _orig_us
          print("  ✓ COR-011 同一 item 只标记一次(警告仍逐条); 不再反复击穿 list_items 缓存")

          print("\n审计第二批回归: 10/10 通过")
          PY

