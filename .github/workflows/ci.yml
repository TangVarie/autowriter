          base = dict(severity="soft", scope="project", memory_type="rule",
                      created_at="2026-01-01", frequency=1)
          rows = [
              dict(base, id="naive", content="naive 静音", muted_until="2099-01-01T00:00:00"),
              dict(base, id="us7",   content="7us 静音",   muted_until="2099-01-01T00:00:00.1234567+00:00"),
              dict(base, id="aware", content="aware 静音", muted_until="2099-01-01T00:00:00+00:00"),
              dict(base, id="past",  content="静音已过期", muted_until="2000-01-01T00:00:00+00:00"),
