          def _md5(t): return hashlib.md5((t or "").encode(), usedforsecurity=False).hexdigest()
          LONG = "- " + "很长的观察行" * 700          # ~4200 字, 贴着软上限
          seen = {}
          class _RpcSB:
              def __init__(s, ret=None, missing=False): s.ret, s.missing = ret, missing
              def rpc(s, name, params):
                  if s.missing:
                      class _X:
                          def execute(_): raise Exception("PGRST202 Could not find the function")
                      return _X()
                  seen.update(name=name, params=params)
                  class _X:
                      def execute(_): return _R(s.ret)
                  return _X()
              def table(s,*a,**k):
                  raise AssertionError("RPC 可用时不该再走 .table() 全文过滤")
          row = db.update_calibration_notes_cas(
              _RpcSB([{"id": "p1", "calibration_notes": "new"}]), "p1", LONG, "new")
          assert row["id"] == "p1"
          assert seen["name"] == "update_calibration_notes_cas"
          assert seen["params"]["_expected_md5"] == _md5(LONG)
          assert len(seen["params"]["_expected_md5"]) == 32
          assert LONG not in "".join(map(str, seen["params"].values())), "全文还是进了请求"
          assert db.update_calibration_notes_cas(_RpcSB([]), "p", LONG, "n") is None, \
              "RPC 回 0 行应表示 CAS 冲突"
          # 空 witness: COALESCE 让 NULL 与 '' 同态, R-036 的 or_ 特例不再需要
          db.update_calibration_notes_cas(_RpcSB([{"id": "p"}]), "p", "", "x")
          assert seen["params"]["_expected_md5"] == _md5("")
          # RPC 没部署 → 专用异常(调用方降级); 其它错误必须原样上抛
          try:
              db.update_calibration_notes_cas(_RpcSB(missing=True), "p", "", "x")
