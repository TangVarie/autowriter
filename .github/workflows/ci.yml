          # SUP-004 · list_projects 的 N+1
          # ══════════════════════════════════════════════════════════════════
          def t_sup004():
              N = 40
              projects = [{"id": f"p{i}", "name": f"项目{i}", "brand": "b", "owner_id": "o"}
                          for i in range(N)]
              mems = []
              for i in range(N):
                  mems += [{"id": f"m{i}h", "project_id": f"p{i}", "scope": "project",
                            "status": "confirmed", "severity": "hard", "muted_until": None,
                            "memory_type": "rule", "content": "禁词", "embedding": "[0.1]"},
                           {"id": f"m{i}s", "project_id": f"p{i}", "scope": "project",
                            "status": "confirmed", "severity": "soft", "muted_until": None,
                            "memory_type": None, "content": "偏好", "embedding": "[0.1]"}]
              sb = _SB(rows={"projects": projects, "memories": mems},
                       rpc_impl={"deskcore_fingerprint_counts":
                                 lambda a: [{"project_id": "p3", "n": 7}]})
              out = C.list_projects(sb, user_id="o")
              assert len(out) == N, len(out)
              assert out[3]["hard_rules"] == 1 and out[3]["soft_rules"] == 1, out[3]
              assert out[3]["fingerprint_count"] == 7, out[3]
              assert out[0]["fingerprint_count"] == 0, out[0]

              # ① 查询次数与项目数【无关】。翻页会多打一次拿空页, 所以给一点余量。
              assert len(sb.calls) <= 6, f"{N} 个项目发了 {len(sb.calls)} 次查询, 还是 N+1"
              assert len(sb.rpc_calls) == 1, sb.rpc_calls

              # ② 不再为了数两个数把 768 维向量拉回来
              assert not [c for c in sb.calls if "embedding" in (c["cols"] or "")], \
                  "计数路径还在拉 embedding 列"

              # ③ RPC 没部署 → 退回逐项目 count, 结果仍然对
