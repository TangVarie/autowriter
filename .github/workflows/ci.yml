              cached = [b for b in blocks if "cache_control" in b]
              assert len(cached) == 4, len(cached)
              assert all(b["cache_control"] == cc for b in cached), cached
              assert "cache_control" not in blocks[-1], "p2 不该缓存"

              msgs = [{"role": "user", "content": "历史"}]
              assert G.ClaudeEngine._apply_prior_cache_breakpoint(msgs) is True
              assert msgs[-1]["content"][0]["cache_control"] == cc, msgs

              # 全仓只有一处构造 cache_control —— 分散写会让主生成和合规复审用上不同的
              # ttl, 两者就不再共享同一份前缀, 而"合规搭便车"正是它省钱的全部理由。
              gtree = ast.parse(open("generator.py", encoding="utf-8").read())

