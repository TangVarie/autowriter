          # 必须知道"当前模型"是什么。翻页与 hard_cap 的性质一个都没变。
          assert len(S.fingerprints_needing_vectors(sb3, "p", "m")) == 2000, "hard_cap 失效"
          assert sb3.log[0]["order"] == ["created_at", "id"], sb3.log[0]

