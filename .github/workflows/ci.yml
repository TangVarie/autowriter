                  f"cache_control 字面量共 {len(all_lits)} 处, 其中只有 {len(inside)} 处在 "
                  "_cache_control 里 —— 散落的那些不会跟着 ttl 走, 主生成和合规复审会用上"
                  "不同的 cache_control, 两者就不再共享同一份缓存前缀")

              # 判据: 认得出 ttl 被拒, 认不出普通 400
