          assert fp.opening_hash("   \n\n  ") == "", "全空白也算没有开头"
          assert fp.opening_hash("今天聊聊防晒") != ""
          assert fp.opening_hash("今天聊聊防晒") == fp.opening_hash("今天聊聊防晒")
          print("  ✓ 空开头 → 空哈希; 有开头 → 稳定非空哈希")
          cd = inspect.getsource(C.check_drafts)
