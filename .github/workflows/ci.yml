          def t_rob013_close():
              closed = []

              class _Sub:
                  def __init__(self, tag):
                      self.tag = tag

                  def close(self):
                      closed.append(self.tag)

              class _Lazy:
                  """惰性子客户端: 被【属性访问】就现建一个 —— 关连接时绝不能触发它。"""
                  def __init__(self):
                      self.built = 0
                      self.auth = _Sub("auth")
                      self._postgrest = _Sub("postgrest")
                      self._storage = None          # 还没建过
                      self._functions = None

                  @property
                  def storage(self):
                      self.built += 1
                      return _Sub("storage")

                  @property
                  def postgrest(self):
                      self.built += 1
                      return self._postgrest

              c = _Lazy()
              db.close_client(c)
              assert "auth" in closed and "postgrest" in closed, closed
              assert c.built == 0, "close_client 访问了属性, 把还没建的子客户端现建了出来"
              assert "storage" not in closed, closed

              # 一个子客户端关不掉, 不能拦住其余的
              class _Bad(_Lazy):
                  def __init__(self):
                      super().__init__()
                      self.auth = type("X", (), {"close": lambda s: (_ for _ in ()).throw(OSError("boom"))})()
              closed.clear()
              db.close_client(_Bad())
              assert closed == ["postgrest"], closed

              # auth 的一次性 client 必须走会关连接的上下文管理器
              import auth as A
              a_src = inspect.getsource(A)
              tree = ast.parse(a_src)
              fns = {"sign_up", "sign_in", "sign_out", "_try_refresh_session", "_try_cookie_restore"}
              for node in ast.walk(tree):
                  if isinstance(node, ast.FunctionDef) and node.name in fns:
                      raw = [n for n in ast.walk(node)
                             if isinstance(n, ast.Call) and isinstance(n.func, ast.Name)
                             and n.func.id == "_fresh_auth_client"]
                      assert not raw, f"{node.name} 还在裸调 _fresh_auth_client, 连接不会被关(ROB-013)"
              assert "db.close_client(client)" in inspect.getsource(A._auth_client)


          # ══════════════════════════════════════════════════════════════════
          # SUP-008 · 锁池上限, 且绝不淘汰正在被持有的锁
          # ══════════════════════════════════════════════════════════════════
          def t_sup008():
              db._MEMORY_UPSERT_LOCKS.clear()
              old_max = db._MEMORY_UPSERT_LOCKS_MAX
              db._MEMORY_UPSERT_LOCKS_MAX = 8
              try:
                  for i in range(200):
                      with db._memory_upsert_lock(f"k{i}"):
                          pass
                  assert len(db._MEMORY_UPSERT_LOCKS) <= 8, \
                      f"锁池无上限: {len(db._MEMORY_UPSERT_LOCKS)}(SUP-008 没修掉)"

                  # 关键正确性: 正在被持有的 key 绝不能被淘汰 —— 换了锁对象就不再互斥
                  held = threading.Event()
                  release = threading.Event()

                  def _holder():
                      with db._memory_upsert_lock("HOT"):
                          held.set()
                          release.wait(5)

                  t = threading.Thread(target=_holder, daemon=True)
                  t.start()
                  assert held.wait(5)
                  hot_lock = db._MEMORY_UPSERT_LOCKS["HOT"][0]
                  for i in range(200, 400):        # 疯狂制造淘汰压力
                      with db._memory_upsert_lock(f"k{i}"):
                          pass
                  assert "HOT" in db._MEMORY_UPSERT_LOCKS, "把正在被持有的锁淘汰掉了 —— 互斥当场失效"
                  assert db._MEMORY_UPSERT_LOCKS["HOT"][0] is hot_lock, "锁对象被换掉了"
                  release.set()
                  t.join(5)

                  # 用完了才可以被淘汰
                  for i in range(400, 600):
                      with db._memory_upsert_lock(f"k{i}"):
                          pass
                  assert "HOT" not in db._MEMORY_UPSERT_LOCKS, "用完之后仍然赖着不走"

                  # 真的互斥: 两个线程抢同一个 key 不会同时进临界区
                  db._MEMORY_UPSERT_LOCKS_MAX = 1
                  overlap, inside = [], []

                  def _worker():
                      with db._memory_upsert_lock("SAME"):
                          inside.append(1)
                          overlap.append(len(inside))
                          time.sleep(0.01)
                          inside.pop()

                  ts = [threading.Thread(target=_worker) for _ in range(6)]
                  [x.start() for x in ts]
                  [x.join(5) for x in ts]
                  assert max(overlap) == 1, f"同一个 key 上出现了并发: {overlap}"
              finally:
                  db._MEMORY_UPSERT_LOCKS_MAX = old_max
                  db._MEMORY_UPSERT_LOCKS.clear()


