          def t_codex_p1_multi_engine_version_num():
              """多引擎批次: 同一 item 的每个引擎各一条首版, 版本号必须互不相同。

              这是本次审计**自己引入**的最严重一处回归。migrations/003 装上
              UNIQUE(item_id, version_num) 之后, 原来给每条都写 version_num=1 的
              bulk_create_initial_versions 会让每一个多引擎批次的首版 insert 撞 23505;
              而 app._save_batch_results 的失败路径会删掉已建的 items —— 整批生成完
              什么也不存, 用户只看到一行"批量写入 versions 失败"。
              """
              seen = {}

              class _Ins:
                  def __init__(self, rows):
                      self.rows = rows

                  def execute(self):
                      for r in self.rows:                       # 模拟唯一索引
                          k = (r["item_id"], r["version_num"])
                          assert k not in seen, f"撞唯一索引 {k} —— 整批会回滚"
                          seen[k] = True
                      return type("R", (), {"data": self.rows})()

              class _T:
                  def insert(self, rows):
                      return _Ins(rows)

              class _C:
                  def table(self, _n):
                      return _T()

              rows = ([{"item_id": "i1", "ai_engine": f"e{k}", "title": f"t{k}", "body": "b"}
                       for k in range(3)] +
                      [{"item_id": "i2", "ai_engine": f"e{k}", "title": f"u{k}", "body": "b"}
                       for k in range(2)])
              out = db.bulk_create_initial_versions(_C(), rows)
              nums = {}
              for r in out:
                  nums.setdefault(r["item_id"], []).append(r["version_num"])
              assert nums == {"i1": [1, 2, 3], "i2": [1, 2]}, nums
              # 引擎与号的对应关系必须按入参顺序, 不能被重排
              assert [r["ai_engine"] for r in out if r["item_id"] == "i1"] == ["e0", "e1", "e2"]

              # 单引擎(每 item 一条)仍然全是 1 —— 老数据的语义不变
              seen.clear()
              solo = db.bulk_create_initial_versions(
                  _C(), [{"item_id": f"x{k}", "ai_engine": "e", "title": "t", "body": "b"}
                         for k in range(4)])
              assert {r["version_num"] for r in solo} == {1}, solo

              # migrations/003 的重编号必须和上面同一套口径(同 item 内从 1 连续排)
              sql = open("migrations/003_versions_unique_num.sql", encoding="utf-8").read()
              assert "row_number() OVER (" in sql and "PARTITION BY v.item_id" in sql
              assert "ORDER BY v.version_num, v.created_at, v.id" in sql, \
                  "重编号的排序口径变了, 迁移后的历史数据会和新写入的对不上"


          def t_codex_p1_health_timeout_actually_fires():
              """/health 的墙钟上限必须真的会触发。

              codex 指出并经实测确认: to_thread.run_sync 默认 abandon_on_cancel=False,
              取消要等工作线程返回才生效 —— fail_after 形同虚设, 而"库卡住不回"正是
              ROB-004 唯一针对的场景。这条断言把 anyio 的这个坑钉成可执行的知识:
              先证明默认值确实不生效(否则下面那半就是废话), 再证明我们用的写法生效。
              """
              import time as _t
              import anyio
              import anyio.to_thread

              def _slow():
                  _t.sleep(0.8)
                  return "finished-anyway"

              async def _run(abandon):
                  t0 = _t.monotonic()
                  try:
                      with anyio.fail_after(0.2):
                          r = await anyio.to_thread.run_sync(_slow, abandon_on_cancel=abandon)
                      return ("returned", r, _t.monotonic() - t0)
                  except TimeoutError:
                      return ("timeout", None, _t.monotonic() - t0)

              kind, val, dt = anyio.run(_run, False)
              assert kind == "returned" and dt > 0.6, (
                  f"anyio 的行为变了({kind}, {dt:.2f}s) —— 下面那条断言的前提没了, 重新想")

              kind, val, dt = anyio.run(_run, True)
              assert kind == "timeout" and dt < 0.5, (kind, dt)

              # 真正的守卫: /health 的探测必须传 abandon_on_cancel=True。
              # 只读源码不 import —— deskcore/app.py 要 fastapi, 本步骤没装。
              tree = ast.parse(open("deskcore/app.py", encoding="utf-8").read())
              probe = next(n for n in ast.walk(tree)
                           if isinstance(n, ast.AsyncFunctionDef) and n.name == "_probe")
              kws = [k for n in ast.walk(probe) if isinstance(n, ast.Call) for k in n.keywords]
              ok = any(k.arg == "abandon_on_cancel"
                       and isinstance(k.value, ast.Constant) and k.value.value is True
                       for k in kws)
              assert ok, "_probe 没传 abandon_on_cancel=True —— 那个 fail_after 不会生效"

              # 网络层兜底: 被放弃的线程要能自己收场, 否则线程和连接永久驻留
              src = open("deskcore/app.py", encoding="utf-8").read()
              assert "postgrest_client_timeout" in src, \
                  "探测 client 没有网络超时, 被放弃的线程会一直挂着"


          def t_codex_p2_marked_after_success():
              """标记去重要在【写成功之后】记, 否则一次瞬时错误会让 item 停在原状态。"""
              tree = ast.parse(_app_func_src("_run_hard_constraint_check"))
              add = [n for n in ast.walk(tree)
                     if isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute)
                     and n.func.attr == "add"
                     and isinstance(n.func.value, ast.Name) and n.func.value.id == "marked_items"]
              assert len(add) == 1, f"marked_items.add 出现 {len(add)} 次"
              # 那次 add 必须在 try 体里、且排在 update_item_status 之后
              tries = [n for n in ast.walk(tree) if isinstance(n, ast.Try)]
