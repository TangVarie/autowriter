      - name: 审计第一批止血回归 (COR-003/005/006/007/010 · 2026-08-23)
        run: |
          python - <<'PY'
          # docs/audit-2026-08-23-full.md 第 1 批(止血)的回归。全部假件, 不联网。
          # ROB-003(deskcore fail-closed)在下面 "app 冒烟" 那一步里测, 因为它要真起服务。
          import os, hashlib, inspect
          os.environ.setdefault("AW_DISABLE_ST_CACHE", "1")
          import db, memory as M, deskcore.store as S

          class _R:
              def __init__(s, d): s.data = d

          # ══ COR-010: 写入返回 0 行必须是可读异常, 不是 IndexError ══════════
          # PostgREST 对"匹配 0 行"的 UPDATE 不报错、只回空 data(行被并发删 /
          # RLS 拦下)。裸 res.data[0] 会抛 IndexError, 在 Streamlit 上是一片红屏,
          # 既看不出哪一步也不知道怎么办。
          class _Q0:
              def __init__(s, out): s.out = out; s.mode = None
              def insert(s,*a,**k): s.mode="ins"; return s
              def update(s,*a,**k): s.mode="upd"; return s
              def select(s,*a,**k): s.mode="sel"; return s
              def eq(s,*a,**k): return s
              def order(s,*a,**k): return s
              def limit(s,*a,**k): return s
              def execute(s):
                  if s.mode == "sel": return _R([{"version_num": 3}])
                  return _R(s.out)
          class _SB0:
              def __init__(s, out): s.out = out
              def table(s,*a,**k): return _Q0(s.out)

          WRITES = [
              ("创建项目",     lambda c: db.create_project(c, "u", "n")),
              ("创建批次",     lambda c: db.create_batch(c, "u", "p", "t", {}, ["claude"])),
              ("创建条目",     lambda c: db.create_item(c, "u", "b")),
              ("创建版本",     lambda c: db.create_version(c, "i", "claude", "t", "b")),
              ("更新条目状态", lambda c: db.update_item_status(c, "i", "approved")),
              ("标记正负例",   lambda c: db.set_item_example_label(c, "i", "positive")),
              ("更新记忆",     lambda c: db.update_memory(c, "m", {"content": "x"})),
              ("入队任务",     lambda c: db.insert_job(c, "noop", {}, "u")),
          ]
          for name, fn in WRITES:
              try:
                  fn(_SB0([]))
                  raise AssertionError(f"{name}: 0 行居然没报错")
              except IndexError:
                  raise AssertionError(f"{name}: 仍抛 IndexError(红屏), 没走 _first_row")
              except db.WriteReturnedNoRow as e:
                  assert name in str(e) and "RLS" in str(e), str(e)
              assert fn(_SB0([{"id": "x1"}])) == {"id": "x1"}, name
          # res=None 也不能炸成 AttributeError
          try:
              db._first_row(None, "假操作"); raise AssertionError
          except db.WriteReturnedNoRow: pass
          # 全库不该再留【无守卫】的 return <x>.data[0]。
          # 用 AST 而不是文本匹配: `if res.data: return res.data[0]` 和
          # `return res.data[0] if res.data else None` 都是安全的, 按行 grep
          # 会把它们一起误报(round-5 §6 已经为"文本匹配不可靠"写过理由)。
          import ast as _ast
          _tree = _ast.parse(open("db.py", encoding="utf-8").read())
          _parent = {}
          for _n in _ast.walk(_tree):
              for _c in _ast.iter_child_nodes(_n):
                  _parent[_c] = _n

          def _is_data_index(n):
              return (isinstance(n, _ast.Subscript)
                      and isinstance(n.value, _ast.Attribute) and n.value.attr == "data"
                      and isinstance(n.value.value, _ast.Name)
                      and isinstance(getattr(n.slice, "value", None), int))

          def _has_data_guard(n):
              p = _parent.get(n)
              while p is not None and not isinstance(p, (_ast.FunctionDef, _ast.AsyncFunctionDef)):
                  if isinstance(p, _ast.If) and any(
                          isinstance(a, _ast.Attribute) and a.attr == "data"
                          for a in _ast.walk(p.test)):
                      return True
                  p = _parent.get(p)
              return False

          bare = [n.lineno for n in _ast.walk(_tree)
                  if isinstance(n, _ast.Return) and n.value is not None
                  and _is_data_index(n.value) and not _has_data_guard(n)]
