          assert _s.index("insert(payload).execute()") < _s.index("list_items.clear()"), \
              "clear() 跑到 insert 前面 —— 并发读会把缓存回填成写入前的旧快照"
          print("  ✓ COR-009 list_items.clear() 在 INSERT 之后")

          # ══ ROB-018: UPDATE 0 行不再当成功 ═════════════════════════════════
          class _ZQ:
              def __init__(s, out): s.out = out
              def update(s, *a, **k): return s
              def eq(s, *a, **k): return s
              def execute(s): return _R(s.out)
          class _ZSB:
              def __init__(s, out): s.out = out
              def table(s, *a, **k): return _ZQ(s.out)
          assert db.seal_session(_ZSB([]), "s", "window_full") is False, "0 行却报 seal 成功"
          assert db.seal_session(_ZSB([{"id": "s"}]), "s", "window_full") is True
          assert db._best_effort_item_patch(_ZSB([]), "i", {"x": 1}, "t") is False
          assert db._best_effort_item_patch(_ZSB([{"id": "i"}]), "i", {"x": 1}, "t") is True
          for fn in (db.save_feedback_draft, db.clear_feedback_draft,
                     db.save_manual_edit_draft, db.clear_manual_edit_draft):
              assert "_best_effort_item_patch" in inspect.getsource(fn), fn.__name__
          print("  ✓ ROB-018 seal_session / 四个草稿写入都看受影响行数并留痕")

          # ══ COR-020: 带 rule_kind 但缺 content 不再 KeyError ═══════════════
          hits = validator.check_hard_rules(
              [{"rule_kind": "forbidden_word", "rule_payload": {"target": "最"}}],
              title="全网最低价", body="")
          assert hits and hits[0]["match"] == "最" and hits[0]["rule"] == "", hits
          for kind, payload, t, b in [("required_phrase", {"target": "认证"}, "标题", "正文"),
                                      ("max_len", {"scope": "标题", "n": 2}, "很长的标题", ""),
                                      ("forbidden_regex", {"pattern": "最."}, "最低价", "")]:
              assert validator.check_hard_rules([{"rule_kind": kind, "rule_payload": payload}],
                                                title=t, body=b), kind
          assert validator.check_hard_rules([{"content": "禁止出现'最'字"}],
                                            title="最低价", body="")[0]["rule"] == "禁止出现'最'字"
          # 同样走 AST: 函数里的注释写着 rule["content"] 在解释为什么不能这么用。
          _vt = ast.parse(textwrap.dedent(inspect.getsource(validator.check_hard_rules)))
          assert not [
              1 for _c in ast.walk(_vt)
              if isinstance(_c, ast.Subscript) and isinstance(_c.value, ast.Name)
              and _c.value.id == "rule" and isinstance(_c.slice, ast.Constant)
              and _c.slice.value == "content"
          ], "又出现 rule['content'] 直取 —— 缺 content 键的结构化规则命中时会 KeyError"
          print("  ✓ COR-020 四种 kind 的上报路径都不再触碰 rule['content']")

          # ══ COR-021: 只剥外层围栏, 正文里的反引号必须活下来 ═════════════════
          import json as _json
          f = G._strip_outer_code_fence
          assert f('```json\n{"a":1}\n```') == '{"a":1}'
          assert f('```\n{"a":1}\n```') == '{"a":1}'
          assert f('{"a":1}') == '{"a":1}'
          assert f('```json\n{"a":1}') == '{"a":1}'          # 输出截断: 只剥开栏
          assert f('前言\n{"a":1}') == '前言\n{"a":1}'
          body = "先看这段代码：\n```python\nprint(1)\n```\n就这样"
          raw = '```json\n' + _json.dumps({"title": "t", "body": body, "keywords": ["k"]},
                                          ensure_ascii=False) + '\n```'
          r = G._parse_copy_json(raw, "claude/test")
          assert r.error is None and r.body == body, f"正文被就地改写: {r.body!r}"
          arr = '```json\n' + _json.dumps([{"title": "t1", "body": body, "keywords": []},
                                           {"title": "t2", "body": "普通", "keywords": []}],
                                          ensure_ascii=False) + '\n```'
          rs = G._parse_copy_json_list(arr, 2, "claude/test")
          assert len(rs) == 2 and rs[0].body == body and not rs[0].error
          assert _json.loads(G._extract_json_payload('```json\n{"violations":[]}\n```')) == {"violations": []}
          assert G._extract_json_payload('前言 {"a":1} 后记') == '{"a":1}'
          # 反证旧的全局剥法
          import re as _re
          _old = _re.sub(r'```(?:json)?\s*', '', raw).replace('```', '').strip()
          assert "```" not in _old and _old != f(raw), "前提变了: 旧写法本就会抹掉正文里的围栏"
          print("  ✓ COR-021 正文内的 ```python 代码块原样保留(旧的全局剥法会抹掉)")

          # ══ COR-022: 引擎名重复不再让两个"版本"指向同一个对象 ═══════════════
          class _FakeEngine:
              def generate(self, **kw):
                  return [G.GenerationResult(title=f"t{i}", body="b", keywords=[],
                                             ai_engine="claude/x") for i in range(kw["count"])]
          _orig_ge = G.get_engine
          G.get_engine = lambda name: _FakeEngine()
          try:
              slots = G.generate_batch(system_prompt="s", tactic="t", count=2,
                                       engines=["claude", "claude"], metrics=None)
              assert len(slots) == 2 and len(slots[0]["versions"]) == 1, \
                  "重复引擎名没去重 —— 同一个 slot 会拿到同一个对象两份引用"
              ids = {id(v) for s_ in slots for v in s_["versions"]}
              assert len(ids) == 2, "不同 slot 共享了同一个 GenerationResult"
              assert len(G.generate_batch(system_prompt="s", tactic="t", count=2,
