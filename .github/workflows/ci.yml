          def t_sup001():
              assert config.ANTHROPIC_CACHE_TTL in ("5m", "1h")
              G._cache_ttl_disabled = False
              cc = G._cache_control()
              assert cc == {"type": "ephemeral", "ttl": "1h"}, cc

              layers = {"stable": "S" * 50, "tactic": "T", "p0": "P0", "p1": "P1", "p2": "P2"}
