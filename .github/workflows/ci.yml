      - name: 审计第二批回归 (数据一致性与并发 · COR-002/004/008/009/011/020/021/022 · ROB-009/018)
        run: |
          python - <<'PY'
          # docs/audit-2026-08-23-full.md 第 2 批。全部假件, 不联网。
          # 每条都先复现【失败模式】再证明修好 —— 只断言"现在是对的"挡不住回退。
          import os, ast, types, inspect
          os.environ.setdefault("AW_DISABLE_ST_CACHE", "1")
          import db, validator, telemetry, uuid
          import generator as G

          class _R:
              def __init__(s, d): s.data = d

          # 通用假件: 支持 range 翻页 + 模拟服务端 max-rows 钳短
          class _PQ:
              def __init__(s, store, log, cap):
                  s.s, s.log, s.cap, s.orders = store, log, cap, []
              def select(s, *a, **k): return s
              def eq(s, *a, **k): return s
              def in_(s, *a, **k): return s
              @property
              def not_(s): return s
              def is_(s, *a, **k): return s
              def order(s, c, **k): s.orders.append(c); return s
              def range(s, lo, hi): s.lo, s.hi = lo, hi; return s
              def execute(s):
                  page = s.s[s.lo:s.hi + 1]
                  if s.cap is not None: page = page[:s.cap]
                  s.log.append({"order": list(s.orders), "range": (s.lo, s.hi)})
                  return _R(page)
          class _PSB:
              # table() 每次返回新 builder —— postgrest-py 就是这样, 复用会让
              # .order() 累积、.range() 偏移叠加。
              def __init__(s, store, cap=None): s.s, s.log, s.cap = store, [], cap
              def table(s, *a, **k): return _PQ(s.s, s.log, s.cap)

          # ══ COR-008: 「短页收工」必须换成「空页收工」════════════════════════
          # 服务端 db-max-rows 低于 page_size 时**每一页都是短页**, 按短页收工
          # 就只拿第一页; offset 按 page_size 跳还会漏掉中间那段。两者都静默。
          rows = [{"item_id": f"i{n}"} for n in range(2500)]
          sb = _PSB(rows, cap=137)
          got = db.get_session_committed_item_ids(sb, "s1")
          assert len(got) == 2500, f"钳短时只拿到 {len(got)} —— committed set 不全会让懒同步重复 append"
          assert sb.log[1]["range"][0] == 137, sb.log[1]
          assert sb.log[0]["order"] == ["id"], "翻页缺唯一稳定次级键"
          assert db.get_session_committed_item_ids(_PSB([]), "s") == set()
          sb2 = _PSB([{"id": i} for i in range(3000)])
          assert len(db._paged_select(lambda o, l: sb2.table().select().range(o, o + l - 1))) == 3000
          assert len(sb2.log) == 4, f"空页收工应发 4 次(3 满页 + 1 空页), 实际 {len(sb2.log)}"
          sb3 = _PSB([{"id": i} for i in range(3000)])
          assert len(db._paged_select(lambda o, l: sb3.table().select().range(o, o + l - 1),
