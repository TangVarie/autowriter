          print("  ✓ COR-005/006 三处翻页: 钳到 137/页仍取全 2500; hard_cap 到顶即停; 空库不死循环")

          print("\n审计第一批止血回归: 5/5 通过 (ROB-003 见下方 app 冒烟)")
